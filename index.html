<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- SECURITY: keep the admin panel out of search engines, never leak the admin URL via Referer -->
<meta name="robots" content="noindex,nofollow,noarchive"/>
<meta name="referrer" content="no-referrer"/>
<title>Oro Admin</title>
<!-- SECURITY: refuse to be embedded in another site (clickjacking) -->
<script>try { if (window.top !== window.self) window.top.location = window.self.location; } catch (x) { document.documentElement.style.display = 'none'; }</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{oro:{o:'#F97316',oh:'#EA580C',c:'#222222',g:'#F5F5F5'}}}}}</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>window.lucide = window.lucide || { createIcons() {} }; /* SECURITY/RESILIENCE: panel still works if the icon CDN fails */</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans bg-oro-g text-oro-c min-h-screen">

<!-- ADMIN LOGIN GATE (Supabase Auth: email + password, admin role required) -->
<div id="gate" class="fixed inset-0 z-50 bg-oro-c flex items-center justify-center p-4">
  <form id="gateForm" class="bg-white rounded-xl p-6 w-full max-w-xs text-center">
    <div class="w-12 h-12 mx-auto rounded-lg bg-oro-o text-white flex items-center justify-center"><i data-lucide="lock"></i></div>
    <h1 class="text-lg font-bold mt-3">Oro Admin</h1>
    <p class="text-xs text-gray-500 mt-1">Sign in with your admin account.</p>
    <input id="gEmail" type="email" required autocomplete="username" placeholder="Admin email" aria-label="Admin email" class="mt-4 w-full h-11 px-3 text-sm border border-gray-300 rounded-md focus:outline-none focus:border-oro-o"/>
    <input id="gPass" type="password" required autocomplete="current-password" placeholder="Password" aria-label="Password" class="mt-2 w-full h-11 px-3 text-sm border border-gray-300 rounded-md focus:outline-none focus:border-oro-o"/>
    <p id="pinErr" class="hidden text-xs text-red-600 mt-2"></p>
    <button id="gateBtn" class="mt-4 w-full h-11 bg-oro-o hover:bg-oro-oh text-white text-sm font-semibold rounded-md disabled:opacity-50">Sign in</button>
  </form>
</div>

<div id="app" class="hidden md:flex min-h-screen">
  <nav id="nav" class="bg-oro-c text-white md:w-56 md:min-h-screen md:sticky md:top-0 md:self-start flex md:flex-col overflow-x-auto md:overflow-visible sticky top-0 z-30 md:z-auto"></nav>
  <main class="flex-1 min-w-0 p-4 md:p-8">
    <div id="cfgWarn" class="hidden mb-4 p-3 rounded-md bg-amber-50 border border-amber-200 text-sm text-amber-900">Supabase isn't configured. Paste your project URL and anon key at the top of the script.</div>
    <div id="view"></div>
  </main>
</div>

<!-- FORM MODAL -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/60 items-end md:items-center justify-center md:p-4">
  <form id="mForm" class="bg-white w-full md:max-w-xl rounded-t-xl md:rounded-xl max-h-[92vh] flex flex-col">
    <div class="px-5 py-4 border-b flex items-center justify-between"><h2 id="mTitle" class="font-bold"></h2><button type="button" onclick="closeModal()" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div id="mBody" class="p-5 overflow-y-auto space-y-3"></div>
    <div class="px-5 py-4 border-t flex gap-2 justify-end">
      <p id="mErr" class="text-xs text-red-600 mr-auto self-center"></p>
      <button type="button" onclick="closeModal()" class="h-10 px-4 border border-gray-300 rounded-md text-sm font-semibold">Cancel</button>
      <button id="mSave" type="submit" class="h-10 px-5 bg-oro-o hover:bg-oro-oh text-white rounded-md text-sm font-semibold flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">Save</button>
    </div>
  </form>
</div>
<style>@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.toast-in{animation:toastIn .25s ease-out}</style>
<!-- ORDER DETAILS & DISPATCH MODAL -->
<div id="oModal" class="hidden fixed inset-0 z-40 bg-black/60 items-end md:items-center justify-center md:p-4" onclick="if(event.target===this)closeOrder()">
  <div class="bg-white w-full md:max-w-2xl rounded-t-xl md:rounded-xl max-h-[94vh] flex flex-col" role="dialog" aria-modal="true" aria-label="Order Details and Dispatch">
    <div class="px-5 py-4 border-b flex items-center justify-between"><h2 class="font-bold">Order Details &amp; Dispatch <span id="oNum" class="text-oro-o font-mono text-sm ml-1"></span></h2><button type="button" onclick="closeOrder()" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div id="oBody" class="p-5 overflow-y-auto space-y-4"></div>
  </div>
</div>
<style>.np{touch-action:none;cursor:grab}.np:active{cursor:grabbing}</style>
<div id="toast" class="fixed bottom-4 right-4 z-[60] bg-oro-c text-white text-xs px-4 py-3 rounded-lg hidden"></div>

<script>
// ============================================================================
// 🔴 ADMIN CREDENTIALS CONFIGURATION 🔴
// ============================================================================
// Same Supabase project as the storefront. These are PUBLIC (publishable) values.
// Never put a service_role / sb_secret_ key in this file.
const SUPABASE_URL = "https://qogeeqtgzthbbddywklt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EsBjk6guE13njgK8aP6A_g_72qV7RT7";

// Cloudinary Unsigned Upload Configuration
// SECURITY: in Cloudinary > Settings > Upload > Upload presets > "oro_products", restrict allowed formats
// (jpg, png, webp), max file size (e.g. 10 MB), set a fixed folder, and turn OFF "overwrite".
const CLOUDINARY_CLOUD_NAME = "PASTE_YOUR_CLOUDINARY_CLOUD_NAME_HERE";
const CLOUDINARY_UPLOAD_PRESET = "oro_products"; // Preset name you created

// Path/URL of your storefront page, used by the Theme Builder live preview (same site as this admin page).
const STOREFRONT_URL = "index.html";

// NOTE: The old hard-coded ADMIN_PIN was removed. A PIN inside client-side JavaScript is visible to every
// visitor, so it protected nothing. Admin access is now a real Supabase Auth login with the "admin" role,
// and the database (RLS) enforces it. See oro-security-setup.sql.
// ============================================================================

const $ = (id) => document.getElementById(id);
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
// SECURITY: only allow https image URLs from the database to be loaded into the admin page
const safeUrl = (u) => (/^https:\/\//i.test(String(u || '')) ? String(u) : '');
const ok = SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('PASTE') && !SUPABASE_ANON_KEY.includes('PASTE');
// SECURITY: separate storage key so an admin session never mixes with a customer session from the storefront
const db = ok && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'oro-admin-auth', persistSession: true, autoRefreshToken: true } }) : null;
if (!db) $('cfgWarn').classList.remove('hidden');
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); t.classList.remove('toast-in'); void t.offsetWidth; t.classList.add('toast-in'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 2800); }

// ---- Admin login (Supabase Auth + admin role) ----
const isAdmin = (u) => !!u && !!u.app_metadata && u.app_metadata.role === 'admin';
function showPinErr(m) { const el = $('pinErr'); el.textContent = m; el.classList.toggle('hidden', !m); }
function unlock() { $('gate').classList.add('hidden'); $('app').classList.remove('hidden'); $('app').classList.add('md:flex'); showPinErr(''); bumpIdle(); go('dashboard'); }
function showGate() {
  clearTimeout(idleT);
  if (stopNet) { stopNet(); stopNet = null; }
  charts.forEach((c) => c.destroy()); charts = [];
  $('app').classList.add('hidden'); $('app').classList.remove('md:flex');
  bld = null; cur = 'dashboard';
  $('view').innerHTML = ''; $('nav').innerHTML = '';
  ['modal', 'oModal'].forEach((id) => { $(id).classList.add('hidden'); $(id).classList.remove('flex'); });
  $('gate').classList.remove('hidden');
}
async function signOut() { try { if (db) await db.auth.signOut(); } catch (x) { /* ignore */ } showGate(); }
// Auto sign-out after 30 minutes without activity
let idleT = null;
function bumpIdle() { clearTimeout(idleT); idleT = setTimeout(() => { toast('Signed out due to inactivity'); signOut(); }, 30 * 60 * 1000); }
['click', 'keydown', 'pointerdown', 'touchstart'].forEach((ev) => document.addEventListener(ev, () => { if (!$('app').classList.contains('hidden')) bumpIdle(); }, { passive: true }));

let loginFails = 0, lockUntil = 0;
$('gateForm').onsubmit = async (ev) => {
  ev.preventDefault();
  if (!db) return showPinErr('Supabase is not configured or failed to load. Refresh and try again.');
  if (Date.now() < lockUntil) return showPinErr(`Too many attempts. Wait ${Math.ceil((lockUntil - Date.now()) / 1000)}s.`);
  const btn = $('gateBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await db.auth.signInWithPassword({ email: $('gEmail').value.trim().toLowerCase(), password: $('gPass').value });
    $('gPass').value = '';
    if (error || !data || !data.user) {
      loginFails++; if (loginFails >= 5) { lockUntil = Date.now() + 60000; loginFails = 0; }
      return showPinErr('Incorrect email or password.');
    }
    if (!isAdmin(data.user)) { await db.auth.signOut(); return showPinErr('This account does not have admin access.'); }
    loginFails = 0; unlock();
  } catch (x) { showPinErr('Could not sign in. Check your connection.'); }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
};
async function bootAuth() {
  if (!db) return;
  db.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') setTimeout(showGate, 0); }); // also fires if the session expires
  try {
    const { data } = await db.auth.getSession();
    if (data.session && isAdmin(data.session.user)) unlock();
    else if (data.session) await db.auth.signOut();
  } catch (x) { /* stay on the login screen */ }
}

// ---- Table definitions ----
const f = (k, l, t = 'text', x = {}) => ({ k, l, t, ...x });
const DEFAULT_CATS = ['Electronics', 'Home & Kitchen', 'Fashion', 'Beauty', 'Sports & Fitness', 'Toys & Games', 'Automotive'];
const T = {
  products: { label: 'Products', icon: 'package', pk: 'id', fields: [f('title', 'Title', 'title'), f('id', 'Product ID (auto 5-digit, editable)', 'pid'), f('category', 'Category', 'cat'), f('subcategory', 'Subcategory'), f('price', 'Price (₹)', 'number'), f('old_price', 'Old price (₹)', 'number'), f('discount', 'Auto discount', 'autodisc'), f('rating', 'Rating', 'stars'), f('images', 'Product photos', 'images', { max: 6 }), f('description', 'Description', 'area'), f('is_deal', 'Feature in Deals of the Day', 'bool'), f('is_bestseller', 'Feature in Best Sellers', 'bool'), f('is_active', 'Active', 'bool', { def: true })],
    row: (r) => [(r.images || [])[0], r.title, `${inr(r.price)} · ${r.category || 'No category'} · ${r.is_active === false ? 'Hidden' : 'Live'}`] },
  banners: { label: 'Banners', icon: 'image', pk: 'id', fields: [f('title', 'Title'), f('subtitle', 'Subtitle'), f('badge_text', 'Badge', 'text', { def: 'Limited Time Offer' }), f('target_product_id', 'Pick Target Product', 'prodlink'), f('image_url', 'Banner image', 'images', { max: 1, single: true }), f('is_active', 'Active', 'bool', { def: true })],
    row: (r) => [r.image_url, r.title, (r.subtitle || '') + (r.target_product_id ? ` · → Product ${r.target_product_id}` : '')] },
  categories: { label: 'Categories', icon: 'layout-grid', pk: 'id', fields: [f('name', 'Name'), f('icon', 'Lucide icon name (e.g. shirt)', 'text', { def: 'tag' })], row: (r) => [null, r.name, r.icon || ''] },
  coupons: { label: 'Coupons', icon: 'ticket', pk: 'code', fields: [f('code', 'Code'), f('discount_percent', 'Discount %', 'number', { def: 10 }), f('flat_discount', 'Flat discount (₹)', 'number', { def: 0 }), f('max_users', 'Max users', 'number', { def: 100 }), f('is_active', 'Active', 'bool', { def: true })],
    row: (r) => [null, r.code, `${r.discount_percent ?? 0}% + ${inr(r.flat_discount)} off · used ${r.used_count ?? 0}/${r.max_users ?? '∞'} · ${r.is_active === false ? 'Inactive' : 'Active'}`] }
};
// Postgres 42501 = the logged-in role has no GRANT/policy for that action. Explain it instead of showing a raw error.
const dbMsg = (x, tbl) => (x && (x.code === '42501' || /permission denied/i.test(x.message || ''))) ? `No database permission on "${tbl}". Run oro-admin-fix.sql once in the Supabase SQL editor, then sign out and in.` : ((x && x.message) || String(x));
const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const STATUSES = ['Confirmed', 'Dispatched / In Transit', 'Out for Delivery', 'Delivered', 'Cancelled'];
const normStatus = (s) => (!s || s === 'Pending') ? 'Confirmed' : s === 'In Shipping' ? 'Dispatched / In Transit' : s;
const STATUS_CLS = { 'Confirmed': 'bg-orange-100 text-orange-700', 'Dispatched / In Transit': 'bg-blue-100 text-blue-700', 'Out for Delivery': 'bg-violet-100 text-violet-700', 'Delivered': 'bg-emerald-100 text-emerald-700', 'Cancelled': 'bg-red-100 text-red-700' };
const phoneDigits = (p) => { const d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? '91' + d : d; };
// Orders arrive either flat (storefront insert) or with a shipping_address object; normalise both
function normOrder(r) {
  const sa = r.shipping_address && typeof r.shipping_address === 'object' ? r.shipping_address : {};
  let line = String(sa.address ?? r.address ?? ''), lm = sa.landmark || '';
  const m = /,?\s*Near\s+(.+)$/i.exec(line); if (m) { if (!lm) lm = m[1]; line = line.slice(0, m.index); }
  const parts = line.split(',').map((x) => x.trim()).filter(Boolean);
  return { ...r, order_number: r.order_number || r.id, customer_phone: r.customer_phone || r.phone || '', status: normStatus(r.status), items: Array.isArray(r.items) ? r.items : [],
    addr: { house: parts[0] || '', street: parts.slice(1).join(', '), landmark: lm, city: sa.city ?? r.city ?? '', state: sa.state ?? r.state ?? '', pincode: sa.pincode ?? r.pincode ?? '' } };
}
const TABS = [['dashboard', 'Dashboard', 'bar-chart-3'], ['orders', 'Orders', 'shopping-bag'], ['customers', 'Customers', 'users'], ...Object.entries(T).map(([k, v]) => [k, v.label, v.icon]), ['builder', 'Theme Builder', 'layout-template'], ['settings', 'Settings', 'settings'], ['neural', 'Neural Net', 'cpu']];

let cur = 'dashboard', charts = [], stopNet = null;
function go(t) {
  if (cur === 'builder' && typeof bldDirty === 'function' && bldDirty() && !confirm('You have unsaved Theme Builder changes. Leave and discard them?')) return;
  cur = t; charts.forEach((c) => c.destroy()); charts = []; if (stopNet) stopNet(), stopNet = null;
  $('nav').innerHTML = `<div class="hidden md:block px-5 py-5 text-xl font-bold text-oro-o">Oro <span class="text-white text-xs font-medium">Admin</span></div>` +
    TABS.map(([k, l, i]) => `<button onclick="go('${k}')" class="flex items-center gap-2.5 px-4 py-3 md:px-5 text-sm font-medium whitespace-nowrap ${k === t ? 'bg-oro-o text-white' : 'text-gray-300 hover:bg-white/10'}"><i data-lucide="${i}" class="w-4 h-4"></i>${l}</button>`).join('') +
    `<button onclick="signOut()" class="flex items-center gap-2.5 px-4 py-3 md:px-5 text-sm font-medium whitespace-nowrap text-gray-300 hover:bg-white/10 md:mt-auto"><i data-lucide="log-out" class="w-4 h-4"></i>Sign out</button>`;
  ({ dashboard, orders, neural, settings, coupons, builder, customers }[t] || list)(t);
  lucide.createIcons();
}
const empty = (m) => `<div class="bg-white rounded-xl border border-gray-200 p-10 text-center text-sm text-gray-500">${m}</div>`;
const head = (t, extra = '') => `<div class="flex items-center justify-between gap-3 mb-5"><h1 class="text-xl md:text-2xl font-bold">${t}</h1>${extra}</div>`;
async function fetchAll(t, order = 'created_at') {
  if (!db) return [];
  try {
    let q = db.from(t).select('*'); if (order) q = q.order(order, { ascending: false });
    let r = await q;
    if (r.error && order) r = await db.from(t).select('*'); // table may lack created_at
    if (r.error) { toast(`Couldn't load ${t}: ${r.error.message}`); return []; }
    return r.data || [];
  } catch (x) { toast(`Couldn't reach ${t}: ${x.message}`); return []; }
}
async function refreshStorefront() {
  if (!db) return toast('Supabase isn’t configured.');
  try {
    const { count, error } = await db.from('products').select('id', { count: 'exact', head: true }).eq('is_active', true);
    if (error) throw error;
    toast(count ? `${count} live product${count === 1 ? '' : 's'} will show on the storefront` : 'No active products yet: the storefront will be empty');
  } catch (x) { toast('Check failed: ' + x.message); }
}

// ---- Dashboard ----
const ymd = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
async function countRows(t) { if (!db) return null; try { const { count, error } = await db.from(t).select('*', { count: 'exact', head: true }); return error ? null : count; } catch (x) { return null; } }
async function todayVisitors() {
  if (!db) return null;
  try { const { data, error } = await db.from('visits').select('visitor_id').eq('visit_date', ymd(new Date())).limit(10000); if (error) return null; return new Set((data || []).map((v) => v.visitor_id)).size; } catch (x) { return null; }
}
function salesSvg(labels, vals) {
  const W = 600, H = 230, pl = 52, pr = 16, pt = 16, pb = 30, max = Math.max(...vals, 1), n = vals.length;
  const x = (i) => pl + i * (W - pl - pr) / (n - 1), y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const line = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const grid = [0, .25, .5, .75, 1].map((g) => { const yy = pt + (H - pt - pb) * (1 - g); return `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="#E5E7EB" stroke-width="1"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#6B7280">${inr(Math.round(max * g))}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Sales for the last 7 days"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F97316" stop-opacity=".28"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></linearGradient></defs>${grid}
    <path d="${line} L${x(n - 1)} ${H - pb} L${x(0)} ${H - pb} Z" fill="url(#sg)"/><path d="${line}" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="#F97316" stroke-width="2"><title>${labels[i]}: ${inr(v)}</title></circle><text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#6B7280">${labels[i]}</text>`).join('')}</svg>`;
}
// SECURITY: visits are now readable by the admin only (see oro-security-setup.sql). This SQL is kept for reference.
const VISITS_SQL = `create table if not exists visits (id bigint generated always as identity primary key, visitor_id text, visit_date date default current_date, created_at timestamptz default now());
alter table visits enable row level security;
-- run oro-security-setup.sql instead: it creates the table with safe policies (anyone can log a visit, only admin can read)`;
async function dashboard() {
  $('view').innerHTML = head('Dashboard') + '<p class="text-sm text-gray-500">Loading…</p>';
  let [raw, products, visitors, profiles] = [[], [], null, null];
  try {
    [raw, products, visitors, profiles] = await Promise.all([fetchAll('orders'), fetchAll('products', null), todayVisitors(), (async () => { const n = await countRows('profiles'); return n != null ? n : await countRows('users'); })()]);
  } catch (x) { toast('Dashboard load failed: ' + x.message); }
  if (cur !== 'dashboard') return;
  const orders = raw.map(normOrder), live = orders.filter((o) => o.status !== 'Cancelled');
  const rev = live.reduce((s, o) => s + Number(o.total_amount || 0), 0);
  const by = {}; live.forEach((o) => { const k = String(o.customer_email && o.customer_email !== 'guest@oro.in' ? o.customer_email : o.customer_phone || '').toLowerCase().trim(); if (k) by[k] = (by[k] || 0) + 1; });
  const custs = Object.keys(by), rep = custs.filter((k) => by[k] > 1).length, rate = custs.length ? Math.round(rep / custs.length * 1000) / 10 : 0;
  const accounts = profiles != null ? profiles : custs.length, accLbl = profiles != null ? 'Registered accounts' : 'Customers (from orders)';
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  const vals = days.map((d) => live.filter((o) => o.created_at && ymd(new Date(o.created_at)) === ymd(d)).reduce((s, o) => s + Number(o.total_amount || 0), 0));
  const week = vals.reduce((a, b) => a + b, 0);
  const card = (ic, l, v, sub = '', id = '') => `<div class="bg-white rounded-xl border border-gray-200 p-4"><div class="flex items-center gap-2 text-gray-500"><i data-lucide="${ic}" class="w-4 h-4 text-oro-o"></i><p class="text-xs">${l}</p></div><p ${id ? `id="${id}"` : ''} class="text-xl md:text-2xl font-bold mt-1.5">${v}</p><p class="text-[11px] text-gray-500 mt-0.5">${sub}</p></div>`;
  const statusBars = STATUSES.map((st) => { const n = orders.filter((o) => o.status === st).length; return `<div><div class="flex justify-between text-xs mb-1"><span>${st}</span><span class="font-semibold">${n}</span></div><div class="h-2 rounded-full bg-gray-100"><div class="h-2 rounded-full bg-oro-o" style="width:${orders.length ? Math.round(n / orders.length * 100) : 0}%"></div></div></div>`; }).join('');

function genCode() {
  const have = new Set(couponsCache.map((c) => String(c.code).toUpperCase()));
  for (let n = 0; n < 60; n++) {
    const len = 3 + Math.floor(Math.random() * 2), a = new Uint32Array(len); crypto.getRandomValues(a);

}
